name: Go

on: [push]

jobs:
   test-b2:
      runs-on: ${{ matrix.os }}
      strategy:
         matrix:
            os: [ubuntu-26.04, ubuntu-26.04-arm]
            go-version: ["1.22.x", "1.23.x", "1.24.x", "1.25.x", "1.26.x", "1.27.x"]

      steps:
         - uses: actions/checkout@v7

         - name: Setup Go ${{ matrix.go-version }}
           uses: actions/setup-go@v7
           with:
              go-version: ${{ matrix.go-version }}

         - name: Run tests
           run: go test -v ./...

         # the transpiled code keeps memory as uintptr, see README
         - name: Run go vet
           run: go vet -unsafeptr=false ./...

   test-simd:
      runs-on: ${{ matrix.os }}
      strategy:
         matrix:
            os: [ubuntu-26.04, ubuntu-26.04-arm]

      env:
         GOEXPERIMENT: simd
         # SIMD on amd64 needs AVX, arm64 ignores this
         GOAMD64: v3

      steps:
         - uses: actions/checkout@v7

         - name: Setup Go
           uses: actions/setup-go@v7
           with:
              go-version: "1.27.x"

         - name: Run tests
           run: go test -v ./...

         - name: Run go vet
           run: go vet -unsafeptr=false ./...

   # the determinism tests check that wasm gives the same hashes as the native builds
   test-wasm:
      runs-on: ubuntu-26.04-arm
      strategy:
         matrix:
            goexperiment: ["", "simd"]

      env:
         GOOS: wasip1
         GOARCH: wasm
         GOEXPERIMENT: ${{ matrix.goexperiment }}

      steps:
         - uses: actions/checkout@v7

         - name: Setup Go
           uses: actions/setup-go@v7
           with:
              go-version: "1.27.x"

         - uses: bytecodealliance/actions/wasmtime/setup@v1

         - name: Run tests with wasmtime
           run: PATH="$PATH:$(go env GOROOT)/lib/wasm" go test -v ./...

         - name: Run go vet
           run: go vet -unsafeptr=false ./...

   transpile:
      runs-on: ubuntu-latest

      steps:
         - uses: actions/checkout@v7

         - name: Setup Go
           uses: actions/setup-go@v7
           with:
              go-version-file: transpile/go.mod

         - name: Fetch box2d sources
           run: |
              git config --global user.email "you@example.com"
              git config --global user.name "Your Name"
              ./fetch.sh

         - name: Transpile to go code
           run: ./transpile.sh

         - name: Run tests on compiled code
           run: go test -v ./...

   example:
      runs-on: ubuntu-latest

      steps:
         - uses: actions/checkout@v7

         - name: Setup Go
           uses: actions/setup-go@v7
           with:
              go-version-file: example/go.mod

         - name: Install dependencies
           run: |
              sudo apt-get update
              sudo apt-get install libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev

         - name: Compile example
           run: |
              cd example
              go build .

         - name: Compile example to wasm
           run: |
              cd example
              go build .
           env:
              GOOS: js
              GOARCH: wasm
